name: Build LineageOS for Rolex

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build ROM
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex g++-multilib gcc-multilib gnupg gperf imagemagick \
          lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev \
          libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
          openjdk-8-jdk repo git wget

      - name: Sync ROM source
        run: |
          mkdir rom && cd rom
          repo init -u https://github.com/LineageOS/android.git -b lineage-18.1
          repo sync -c --no-tags --no-clone-bundle -j8

      - name: Clone device, vendor, and kernel
        run: |
          cd rom
          git clone https://github.com/redmidevs/android_device_xiaomi_rolex device/xiaomi/rolex
          git clone https://github.com/redmidevs/android_vendor_xiaomi_rolex vendor/xiaomi/rolex
          git clone https://github.com/Thagoo/platform_kernel_xiaomi_msm8917 kernel/xiaomi/rolex

      - name: Build ROM
        run: |
          cd rom
          source build/envsetup.sh
          lunch lineage_rolex-userdebug
          make bacon -j2

      - name: Upload ROM output
        uses: actions/upload-artifact@v2.3.1
        with:
          name: ROM
          path: rom/out/target/product/rolex/*.zip
